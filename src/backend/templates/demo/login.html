{% extends "demo/base.html" %}
{% block title %}Log in &middot; Legal AI Compliance Assistant{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <p class="muted">Cross-jurisdiction compliance analysis for GDPR, DPDP and CCPA.</p>

  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/demo/login" class="stack">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
</section>
{% endblock %}
